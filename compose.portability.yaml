name: ascla-portability
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${ASCLA_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${ASCLA_DB_ROOT_PASSWORD}
    volumes: ["zip_db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30
  wordpress:
    image: wordpress:6.8.3-php8.3-apache
    ports: ["127.0.0.1:8089:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${ASCLA_DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_AUTO_UPDATE_CORE', false);
        define('DISABLE_WP_CRON', true);
    volumes:
      - zip_wordpress:/var/www/html
      - ./config/uploads.ini:/usr/local/etc/php/conf.d/ascla-uploads.ini:ro
    depends_on:
      db: {condition: service_healthy}
  cli:
    image: wordpress:cli-php8.3
    user: "33:33"
    profiles: ["tools"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${ASCLA_DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: "define('WP_ENVIRONMENT_TYPE', 'local'); define('AUTOMATIC_UPDATER_DISABLED', true);"
      ASCLA_ADMIN_PASSWORD: ${ASCLA_ADMIN_PASSWORD}
      ASCLA_DEMO_PASSWORD: ${ASCLA_DEMO_PASSWORD}
    volumes:
      - zip_wordpress:/var/www/html
      - ./dist:/dist:ro
      - ./tests:/opt/ascla-tests:ro
    depends_on: [wordpress]
volumes:
  zip_db:
  zip_wordpress:
