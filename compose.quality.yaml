name: ascla-quality
services:
  sonar:
    image: sonarqube:community
    ports: ["127.0.0.1:9001:9000"]
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes: ["sonar_data:/opt/sonarqube/data", "sonar_extensions:/opt/sonarqube/extensions", "sonar_logs:/opt/sonarqube/logs"]
  scanner:
    image: sonarsource/sonar-scanner-cli:latest
    profiles: ["scan"]
    environment:
      SONAR_HOST_URL: http://sonar:9000
      SONAR_TOKEN: ${SONAR_TOKEN}
    volumes: ["./:/usr/src"]
volumes:
  sonar_data:
  sonar_extensions:
  sonar_logs:
