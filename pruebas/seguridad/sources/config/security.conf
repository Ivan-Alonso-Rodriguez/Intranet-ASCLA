# Apache server configuration; installed by compose.yaml, not by the plugin ZIP.
ServerTokens Prod
ServerSignature Off
TraceEnable Off
<IfModule !headers_module>
    LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
</IfModule>
<Directory /var/www/html>
    Options -Indexes
</Directory>
<IfModule mod_headers.c>
    Header onsuccess unset X-Content-Type-Options
    Header onsuccess unset X-Frame-Options
    Header onsuccess unset Referrer-Policy
    Header onsuccess unset Permissions-Policy
    Header onsuccess unset Cross-Origin-Resource-Policy
    Header onsuccess unset Cross-Origin-Opener-Policy
    Header always unset X-Powered-By
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    Header always set Cross-Origin-Opener-Policy "same-origin"
</IfModule>
