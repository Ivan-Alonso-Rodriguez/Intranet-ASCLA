name: ascla-dev
x-ascla-service-secrets: &ascla-service-secrets
  ASCLA_EXTERNAL_SECRETS_ONLY:
  ASCLA_AI_KEY:
  ASCLA_OPENAI_KEY:
  ASCLA_DEEPSEEK_KEY:
  ASCLA_SUPADATA_KEY:
  ASCLA_GOOGLE_CLIENT_SECRET:
  ASCLA_TURNSTILE_SECRET:
  ASCLA_SMTP_PASSWORD:

services:
  db:
    image: ascla-local-db:secure
    build:
      context: .
      dockerfile: ci/Dockerfile.db
    environment:
      MARIADB_DATABASE: ${ASCLA_DB_NAME:-wordpress}
      MARIADB_USER: ${ASCLA_DB_USER:-wordpress}
      MARIADB_PASSWORD: ${ASCLA_DB_PASSWORD:?Set ASCLA_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${ASCLA_DB_ROOT_PASSWORD:?Set ASCLA_DB_ROOT_PASSWORD in .env}
    volumes: ["db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  mailpit:
    image: ascla-local-mail:secure
    build:
      context: .
      dockerfile: ci/Dockerfile.mailpit
    environment:
      MAILDEV_MAX_EMAILS: 200
      MAILDEV_SMTP_PORT: 1025
      MAILDEV_WEB_PORT: 8025

  wordpress:
    image: ascla-local-app:secure
    build:
      context: .
      dockerfile: ci/Dockerfile.app
    environment:
      <<: *ascla-service-secrets
      WORDPRESS_DB_HOST: ${ASCLA_DB_HOST:-db}
      WORDPRESS_DB_USER: ${ASCLA_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${ASCLA_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${ASCLA_DB_NAME:-wordpress}
      ASCLA_PROJECT_ROOT: /opt/ascla-project
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', '${ASCLA_WP_ENVIRONMENT_TYPE:-local}');
        define('ASCLA_LOCAL_MAIL_CAPTURE', filter_var('${ASCLA_LOCAL_MAIL_CAPTURE:-true}', FILTER_VALIDATE_BOOLEAN));
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_AUTO_UPDATE_CORE', false);
        define('DISABLE_WP_CRON', true);
    volumes:
      - wordpress:/var/www/html
      - ./wp-content/plugins/ascla-core:/var/www/html/wp-content/plugins/ascla-core
      - ./tests:/opt/ascla-tests:ro
      - ./sonar-project.properties:/opt/ascla-project/sonar-project.properties:ro
      - ./README.md:/opt/ascla-project/README.md:ro
      - ./VERSION_HISTORY.md:/opt/ascla-project/VERSION_HISTORY.md:ro
      - ./config/uploads.ini:/usr/local/etc/php/conf.d/ascla-uploads.ini:ro
      - ./config/security.ini:/usr/local/etc/php/conf.d/ascla-security.ini:ro
      - ./config/security.conf:/etc/apache2/conf-enabled/ascla-security.conf:ro
    depends_on:
      db: {condition: service_healthy}
      mailpit: {condition: service_started}
    networks:
      default: {}
      proxy_net:
        aliases:
          - ${COMPOSE_PROJECT_NAME:-ascla-dev}-wordpress

  cron:
    image: wordpress:cli-php8.3@sha256:661db880e953da051abcac6c0a769767b995a82cd52101c003ca7438dd427d7d
    user: "33:33"
    environment:
      <<: *ascla-service-secrets
      WORDPRESS_DB_HOST: ${ASCLA_DB_HOST:-db}
      WORDPRESS_DB_USER: ${ASCLA_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${ASCLA_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${ASCLA_DB_NAME:-wordpress}
      WORDPRESS_CONFIG_EXTRA: |
        define('ASCLA_LOCAL_MAIL_CAPTURE', filter_var('${ASCLA_LOCAL_MAIL_CAPTURE:-true}', FILTER_VALIDATE_BOOLEAN));
        define('WP_ENVIRONMENT_TYPE', '${ASCLA_WP_ENVIRONMENT_TYPE:-local}');
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_AUTO_UPDATE_CORE', false);
    command: ["sh", "-c", "while true; do if wp core is-installed --quiet; then wp cron event run --due-now --quiet; wp ascla jobs --quiet; fi; sleep 10; done"]
    volumes:
      - wordpress:/var/www/html
      - ./wp-content/plugins/ascla-core:/var/www/html/wp-content/plugins/ascla-core
    depends_on: [wordpress]

  cli:
    image: wordpress:cli-php8.3@sha256:661db880e953da051abcac6c0a769767b995a82cd52101c003ca7438dd427d7d
    user: "33:33"
    profiles: ["tools"]
    environment:
      <<: *ascla-service-secrets
      WORDPRESS_DB_HOST: ${ASCLA_DB_HOST:-db}
      WORDPRESS_DB_USER: ${ASCLA_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${ASCLA_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${ASCLA_DB_NAME:-wordpress}
      ASCLA_HTTP_PORT: ${ASCLA_HTTP_PORT:-8088}
      ASCLA_SITE_URL: ${ASCLA_SITE_URL:-}
      ASCLA_SITE_TITLE: ${ASCLA_SITE_TITLE:-ASCLA Comunidad profesional}
      ASCLA_ADMIN_USER: ${ASCLA_ADMIN_USER:-ascla.admin}
      ASCLA_ADMIN_EMAIL: ${ASCLA_ADMIN_EMAIL:-admin@example.invalid}
      ASCLA_ADMIN_PASSWORD: ${ASCLA_ADMIN_PASSWORD}
      ASCLA_DEMO_PASSWORD: ${ASCLA_DEMO_PASSWORD}
      ASCLA_PROFILE_DEMO_PASSWORD: ${ASCLA_PROFILE_DEMO_PASSWORD:-}
      ASCLA_SEED_DATA: ${ASCLA_SEED_DATA:-false}
      # wp-config reads this per process, including WP-CLI.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', '${ASCLA_WP_ENVIRONMENT_TYPE:-local}');
        define('ASCLA_LOCAL_MAIL_CAPTURE', filter_var('${ASCLA_LOCAL_MAIL_CAPTURE:-true}', FILTER_VALIDATE_BOOLEAN));
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_AUTO_UPDATE_CORE', false);
    volumes:
      - wordpress:/var/www/html
      - ./wp-content/plugins/ascla-core:/var/www/html/wp-content/plugins/ascla-core
      - ./scripts:/opt/ascla-scripts:ro
      - ./tests:/opt/ascla-tests:ro
    depends_on: [wordpress]

volumes:
  db:
  wordpress:

networks:
  default:
  proxy_net:
    external: true
    name: proxy_net
