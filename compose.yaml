name: ascla-dev
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${ASCLA_DB_PASSWORD:?Set ASCLA_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${ASCLA_DB_ROOT_PASSWORD:?Set ASCLA_DB_ROOT_PASSWORD in .env}
    volumes: ["db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30
  wordpress:
    image: wordpress:6.8.3-php8.3-apache
    ports: ["127.0.0.1:8088:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${ASCLA_DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_AUTO_UPDATE_CORE', false);
        define('DISABLE_WP_CRON', true);
    volumes:
      - wordpress:/var/www/html
      - ./wp-content/plugins/ascla-core:/var/www/html/wp-content/plugins/ascla-core
      - ./tests:/opt/ascla-tests:ro
      - ./config/uploads.ini:/usr/local/etc/php/conf.d/ascla-uploads.ini:ro
    depends_on:
      db: {condition: service_healthy}
  cron:
    image: wordpress:cli-php8.3
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${ASCLA_DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: "define('WP_ENVIRONMENT_TYPE', 'local'); define('AUTOMATIC_UPDATER_DISABLED', true); define('WP_AUTO_UPDATE_CORE', false);"
    command: ["sh", "-c", "while true; do if wp core is-installed --quiet; then wp cron event run --due-now --quiet; fi; sleep 10; done"]
    volumes:
      - wordpress:/var/www/html
      - ./wp-content/plugins/ascla-core:/var/www/html/wp-content/plugins/ascla-core
    depends_on: [wordpress]
  cli:
    image: wordpress:cli-php8.3
    user: "33:33"
    profiles: ["tools"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${ASCLA_DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      ASCLA_ADMIN_PASSWORD: ${ASCLA_ADMIN_PASSWORD}
      ASCLA_DEMO_PASSWORD: ${ASCLA_DEMO_PASSWORD}
    volumes:
      - wordpress:/var/www/html
      - ./wp-content/plugins/ascla-core:/var/www/html/wp-content/plugins/ascla-core
      - ./scripts:/opt/ascla-scripts:ro
      - ./tests:/opt/ascla-tests:ro
    depends_on: [wordpress]
volumes:
  db:
  wordpress:
