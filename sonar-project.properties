# SonarQube del curso (Jenkins: ramas qa y uat).
# Confirmar con el TA el projectKey definitivo antes de activar el job.
sonar.projectKey=ascla-core
sonar.projectName=ASCLA Core
sonar.projectVersion=1.10.3
sonar.sourceEncoding=UTF-8

sonar.sources=wp-content/plugins/ascla-core
sonar.tests=tests

sonar.exclusions=**/*.png,**/*.webp,**/*.svg,**/vendor/**,**/node_modules/**

# Generados por scripts/quality-ci.sh antes del stage de SonarQube.
sonar.php.coverage.reportPaths=coverage/clover.xml
sonar.php.tests.reportPath=coverage/junit.xml

# Generado por tests/e2e.cjs dentro de scripts/quality-ci.sh.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
