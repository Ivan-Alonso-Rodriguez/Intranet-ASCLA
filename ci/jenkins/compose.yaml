# Optional local verification lab. Explicit operator authorization is required:
# the Docker socket provides broad control over the local Docker daemon.
name: ascla-jenkins-local
services:
  jenkins:
    build:
      context: .
    image: ascla-jenkins-local:verified
    ports: ["127.0.0.1:18090:8080"]
    group_add: ["${ASCLA_DOCKER_GID:?Run scripts/jenkins-local.py}"]
    environment:
      JAVA_OPTS: '-Xmx1024m -Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true -Djenkins.model.Jenkins.workspacesDir=${ASCLA_JENKINS_WORKSPACES}/$${ITEM_FULL_NAME}'
    volumes:
      - home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./init.groovy:/usr/share/jenkins/ref/init.groovy.d/ascla.groovy:ro
      - ${ASCLA_JENKINS_PRIVATE:?Run scripts/jenkins-local.py}/admin-password:/run/secrets/ascla-admin-password:ro
      - ${ASCLA_JENKINS_SOURCE:?Run scripts/jenkins-local.py}:/source:ro
      - ${ASCLA_JENKINS_WORKSPACES:?Run scripts/jenkins-local.py}:${ASCLA_JENKINS_WORKSPACES}
volumes:
  home:
