# CI deployment: all references are immutable image IDs verified by ci-security.py.
# No source bind mounts. Recreate the inherited anonymous core volume on update;
# only the database and uploads survive. CLI/cron share that exact core volume.
name: ascla-ci-runtime
x-wp-environment: &wp-environment
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: ${ASCLA_DB_USER:-wordpress}
  WORDPRESS_DB_PASSWORD: ${ASCLA_DB_PASSWORD:?Required}
  WORDPRESS_DB_NAME: ${ASCLA_DB_NAME:-wordpress}
  ASCLA_EXTERNAL_SECRETS_ONLY: ${ASCLA_EXTERNAL_SECRETS_ONLY:-1}
  ASCLA_AI_KEY:
  ASCLA_OPENAI_KEY:
  ASCLA_DEEPSEEK_KEY:
  ASCLA_SUPADATA_KEY:
  ASCLA_GOOGLE_CLIENT_SECRET:
  ASCLA_TURNSTILE_SECRET:
  ASCLA_SMTP_PASSWORD:
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_ENVIRONMENT_TYPE', '${ASCLA_WP_ENVIRONMENT_TYPE:-local}');
    define('ASCLA_LOCAL_MAIL_CAPTURE', filter_var('${ASCLA_LOCAL_MAIL_CAPTURE:-true}', FILTER_VALIDATE_BOOLEAN));
    define('WP_DEBUG_LOG', true);
    define('WP_DEBUG_DISPLAY', false);
    define('AUTOMATIC_UPDATER_DISABLED', true);
    define('WP_AUTO_UPDATE_CORE', false);
    define('DISABLE_WP_CRON', true);
services:
  db:
    image: ${ASCLA_CI_DB:?Required immutable ID}
    pull_policy: never
    environment:
      MARIADB_DATABASE: ${ASCLA_DB_NAME:-wordpress}
      MARIADB_USER: ${ASCLA_DB_USER:-wordpress}
      MARIADB_PASSWORD: ${ASCLA_DB_PASSWORD:?Required}
      MARIADB_ROOT_PASSWORD: ${ASCLA_DB_ROOT_PASSWORD:?Required}
    volumes: ["db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30
  mailpit:
    image: ${ASCLA_CI_MAILPIT:?Required immutable ID}
    pull_policy: never
    environment:
      MAILDEV_MAX_EMAILS: 200
      MAILDEV_SMTP_PORT: 1025
      MAILDEV_WEB_PORT: 8025
  wordpress:
    image: ${ASCLA_CI_APP:?Required immutable ID}
    pull_policy: never
    environment: *wp-environment
    volumes: ["uploads:/var/www/html/wp-content/uploads"]
    depends_on:
      db: {condition: service_healthy}
      mailpit: {condition: service_started}
    networks:
      default: {}
      proxy_net:
        aliases: ["${COMPOSE_PROJECT_NAME}-wordpress"]
  cron:
    image: ${ASCLA_CI_CLI:?Required immutable ID}
    pull_policy: never
    user: "33:33"
    environment: *wp-environment
    volumes_from: [wordpress]
    command: ["sh", "-c", "while true; do if wp core is-installed --quiet; then wp cron event run --due-now --quiet; wp ascla jobs --quiet; fi; sleep 10; done"]
    depends_on: [wordpress]
  cli:
    image: ${ASCLA_CI_CLI:?Required immutable ID}
    pull_policy: never
    profiles: [tools]
    user: "33:33"
    environment:
      <<: *wp-environment
      ASCLA_SITE_URL: ${ASCLA_SITE_URL:?Required}
      ASCLA_SITE_TITLE: ${ASCLA_SITE_TITLE:-ASCLA Comunidad profesional}
      ASCLA_ADMIN_USER: ${ASCLA_ADMIN_USER:-ascla.admin}
      ASCLA_ADMIN_EMAIL: ${ASCLA_ADMIN_EMAIL:-admin@example.invalid}
      ASCLA_ADMIN_PASSWORD: ${ASCLA_ADMIN_PASSWORD:?Required}
      ASCLA_DEMO_PASSWORD: ${ASCLA_DEMO_PASSWORD:-}
      ASCLA_PROFILE_DEMO_PASSWORD: ${ASCLA_PROFILE_DEMO_PASSWORD:-}
      ASCLA_SEED_DATA: ${ASCLA_SEED_DATA:-false}
    volumes_from: [wordpress]
    depends_on: [wordpress]
volumes:
  db:
  uploads:
networks:
  default:
  proxy_net:
    external: true
    name: proxy_net
